[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vim-client"
version = "1.0.5"
description = "Connect to Vim server, edit files, evaluate Vim expressions, and send commands to Vim."
readme = "README.md"
authors = [
  { name = "James Cherti" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.6, <4"
dependencies = []
keywords = [
  "client",
  "clientserver",
  "edit",
  "remote",
  "server",
  "vim",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: BSD",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Unix",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.6",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Editors",
]

[project.urls]
Homepage = "https://github.com/jamescherti/vim-client"
Repository = "https://github.com/jamescherti/vim-client"
"Bug Reports" = "https://github.com/jamescherti/vim-client/issues"

[project.scripts]
vim-client-edit = "vim_client.cli:cli_edit"
vim-client-diff = "vim_client.cli:cli_diff"

[tool.setuptools.packages.find]
where = ["."]
include = ["vim_client*"]
